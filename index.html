<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Calendar 心情日記簿</title>
  <style>
    :root{
      --bg:#fffdf7;
      --mint:#b8e8d4;
      --mint-deep:#72c6a4;
      --blue:#bfe3ef;
      --pink:#f7c8d8;
      --pink-deep:#e79ab6;
      --yellow:#ffe7a3;
      --purple:#40334e;
      --purple-soft:#ece5f3;
      --text:#403a45;
      --muted:#817887;
      --white:#ffffff;
      --danger:#e47f86;
      --shadow:0 12px 30px rgba(64,51,78,.10);
      --radius:20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}

    .app{
      width:min(1100px,92%);
      margin:0 auto;
      padding:30px 0 50px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:13px;
    }
    .brand-icon{
      width:54px;height:54px;
      display:grid;place-items:center;
      border-radius:18px;
      background:var(--mint);
      font-size:28px;
      box-shadow:0 7px 18px rgba(114,198,164,.18);
    }
    h1{
      margin:0;
      font-size:clamp(25px,4vw,34px);
      color:var(--purple);
      letter-spacing:.5px;
    }
    .subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .account-area{
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .account-input{
      width:min(310px,70vw);
      border:2px solid var(--purple-soft);
      border-radius:14px;
      padding:11px 13px;
      outline:none;
      background:white;
      transition:.2s;
    }
    .account-input:focus{
      border-color:var(--mint-deep);
      box-shadow:0 0 0 4px rgba(114,198,164,.12);
    }

    .btn{
      border:0;
      border-radius:13px;
      padding:11px 15px;
      color:var(--purple);
      background:var(--yellow);
      font-weight:800;
      transition:.2s;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn.secondary{background:var(--purple-soft)}
    .btn.mint{background:var(--mint)}
    .btn.danger{background:#f8d2d5;color:#7e343b}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

    .account-status{
      width:100%;
      text-align:right;
      color:var(--muted);
      font-size:13px;
      min-height:19px;
    }

    .calendar-card{
      background:white;
      border-radius:26px;
      padding:22px;
      box-shadow:var(--shadow);
    }
    .calendar-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
      gap:10px;
    }
    .month-title{
      font-size:25px;
      font-weight:900;
      color:var(--purple);
      text-align:center;
    }
    .month-controls{display:flex;gap:8px}
    .icon-btn{
      width:42px;height:42px;
      border:0;border-radius:13px;
      background:var(--purple-soft);
      color:var(--purple);
      font-weight:900;
      transition:.2s;
    }
    .icon-btn:hover{transform:translateY(-2px);background:var(--mint)}

    .weekdays,.calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:8px;
    }
    .weekday{
      text-align:center;
      color:var(--muted);
      font-weight:800;
      padding:8px 0;
      font-size:14px;
    }
    .day{
      min-height:112px;
      border:2px solid #f0ebf2;
      border-radius:17px;
      background:#fff;
      padding:10px;
      position:relative;
      transition:.2s;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      text-align:left;
    }
    .day:not(.empty):not(.future):hover{
      transform:translateY(-3px);
      border-color:var(--mint-deep);
      box-shadow:0 8px 20px rgba(64,51,78,.08);
    }
    .day.empty{
      background:#faf8fb;
      border-color:transparent;
    }
    .day.future{
      background:#f5f3f6;
      color:#aaa3af;
      cursor:not-allowed;
      opacity:.68;
    }
    .day.today{
      border-color:var(--pink-deep);
      background:#fff8fb;
    }
    .day-number{
      font-weight:900;
      font-size:15px;
    }
    .today-label{
      font-size:10px;
      color:#c86d8f;
      font-weight:900;
      margin-left:5px;
    }
    .mood-emoji{
      align-self:center;
      font-size:35px;
      margin-top:12px;
      line-height:1;
    }
    .day-title{
      align-self:center;
      margin-top:8px;
      max-width:100%;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      color:var(--muted);
      font-size:12px;
    }
    .future-label{
      align-self:center;
      margin:auto 0 3px;
      font-size:11px;
      color:#9b949f;
      font-weight:700;
    }

    .legend{
      display:flex;
      gap:13px;
      flex-wrap:wrap;
      margin-top:18px;
      color:var(--muted);
      font-size:13px;
    }
    .legend span{display:flex;align-items:center;gap:4px}

    .empty-state{
      padding:18px;
      margin-bottom:15px;
      border-radius:16px;
      background:#fff8e9;
      color:#765f31;
      font-size:14px;
      line-height:1.6;
    }

    /* modal */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(49,40,58,.42);
      backdrop-filter:blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:10;
    }
    .overlay.show{display:flex}
    .modal{
      width:min(600px,100%);
      max-height:90vh;
      overflow:auto;
      background:white;
      border-radius:25px;
      padding:25px;
      box-shadow:0 24px 70px rgba(40,30,50,.25);
      animation:pop .18s ease-out;
    }
    @keyframes pop{
      from{opacity:0;transform:scale(.97) translateY(8px)}
      to{opacity:1;transform:none}
    }
    .modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:18px;
    }
    .modal h2{margin:0;color:var(--purple)}
    .date-text{color:var(--muted);font-size:13px;margin-top:4px}
    .close-btn{
      border:0;background:var(--purple-soft);color:var(--purple);
      width:38px;height:38px;border-radius:12px;font-weight:900;
    }

    .field{margin-bottom:17px}
    .field label{
      display:block;
      font-weight:900;
      margin-bottom:8px;
      color:var(--purple);
    }
    .text-input,.textarea{
      width:100%;
      border:2px solid #eee8f0;
      border-radius:14px;
      padding:12px 13px;
      outline:none;
      background:#fff;
      transition:.2s;
    }
    .text-input:focus,.textarea:focus{
      border-color:var(--mint-deep);
      box-shadow:0 0 0 4px rgba(114,198,164,.10);
    }
    .textarea{min-height:180px;resize:vertical;line-height:1.7}

    .moods{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:8px;
    }
    .mood{
      border:2px solid #eee8f0;
      background:white;
      border-radius:15px;
      padding:10px 5px;
      transition:.2s;
    }
    .mood:hover{transform:translateY(-2px)}
    .mood.selected{
      border-color:var(--mint-deep);
      background:#effbf5;
      box-shadow:0 0 0 3px rgba(114,198,164,.10);
    }
    .mood .emoji{display:block;font-size:29px}
    .mood .label{font-size:11px;font-weight:900;color:var(--muted)}

    .modal-actions{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:20px;
    }
    .right-actions{display:flex;gap:8px}

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translate(-50%,20px);
      background:var(--purple);
      color:white;
      padding:12px 18px;
      border-radius:13px;
      opacity:0;
      pointer-events:none;
      transition:.25s;
      z-index:20;
      box-shadow:var(--shadow);
      font-size:14px;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .loading{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      background:rgba(255,253,247,.72);
      backdrop-filter:blur(2px);
      z-index:30;
      color:var(--purple);
      font-weight:900;
    }
    .loading.show{display:grid}

    footer{
      text-align:center;
      color:#948b98;
      font-size:12px;
      margin-top:18px;
    }

    @media(max-width:700px){
      .app{width:94%;padding-top:18px}
      .account-area{width:100%;justify-content:flex-start}
      .account-input{width:100%}
      .account-status{text-align:left}
      .calendar-card{padding:12px}
      .calendar-grid,.weekdays{gap:4px}
      .day{min-height:76px;padding:7px;border-radius:12px}
      .mood-emoji{font-size:27px;margin-top:9px}
      .day-title{display:none}
      .weekday{font-size:11px}
      .moods{grid-template-columns:repeat(5,1fr)}
      .mood{padding:7px 2px}
      .mood .emoji{font-size:24px}
      .mood .label{font-size:9px}
      .modal{padding:18px}
    }

    @media(max-width:430px){
      .day{min-height:64px}
      .day-number{font-size:13px}
      .mood-emoji{font-size:22px}
      .today-label{display:none}
      .modal-actions{flex-direction:column}
      .right-actions{width:100%}
      .right-actions .btn{flex:1}
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在讀取你的日記⋯</div>

  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">🌷</div>
        <div>
          <h1>Mood Calendar</h1>
          <p class="subtitle">心情日記簿・把每天的小事留下來</p>
        </div>
      </div>

      <div class="account-area">
        <input
          id="emailInput"
          class="account-input"
          type="email"
          placeholder="請輸入 Gmail，例如 name@gmail.com"
          autocomplete="email"
        />
        <button class="btn mint" id="loginBtn">登入／建立我的日記</button>
        <div class="account-status" id="accountStatus">請輸入 Gmail，然後按「登入／建立我的日記」或直接按 Enter</div>
      </div>
    </header>

    <section class="calendar-card">
      <div class="empty-state" id="setupNotice">
        目前這個檔案已經包含「Gmail → 個人日記」的資料介面。
        若要讓不同裝置都能讀到同一份資料，請先在程式最下方設定你的 Supabase URL 與 Anon Key。
        沒有設定時，仍可使用本機示範模式，但資料只會存在這個瀏覽器。
      </div>

      <div class="calendar-top">
        <button class="icon-btn" id="prevMonth" aria-label="上一個月">‹</button>
        <div class="month-title" id="monthTitle"></div>
        <button class="icon-btn" id="nextMonth" aria-label="下一個月">›</button>
      </div>

      <div class="calendar-grid weekdays">
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
        <div class="weekday">日</div>
      </div>

      <div class="calendar-grid" id="calendar"></div>

      <div class="legend">
        <span>😊 HAPPY</span>
        <span>😐 SO-SO</span>
        <span>😭 SAD</span>
        <span>😡 ANGRY</span>
        <span>🌿 CALM</span>
        <span>🔒 未來日期不可新增</span>
      </div>
    </section>

    <footer>資料以 Gmail 作為帳號識別；不進行 Gmail 驗證。</footer>
  </main>

  <div class="overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">新增心情日記</h2>
          <div class="date-text" id="modalDate"></div>
        </div>
        <button class="close-btn" id="closeModal" aria-label="關閉">×</button>
      </div>

      <div class="field">
        <label>今天的心情</label>
        <div class="moods" id="moods"></div>
      </div>

      <div class="field">
        <label for="titleInput">標題</label>
        <input id="titleInput" class="text-input" maxlength="80" placeholder="今天發生了什麼？" />
      </div>

      <div class="field">
        <label for="contentInput">日記內容</label>
        <textarea id="contentInput" class="textarea" maxlength="5000" placeholder="寫下今天想留下來的事情⋯"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn danger" id="deleteBtn">刪除日記</button>
        <div class="right-actions">
          <button class="btn secondary" id="cancelBtn">取消</button>
          <button class="btn mint" id="saveBtn">儲存日記</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /*
      ============================================================
      Mood Calendar 心情日記簿
      資料模式：
      1. 如果設定 SUPABASE_URL / SUPABASE_ANON_KEY：
         → 使用 Supabase REST API，Gmail 作為帳號識別。
         → 同一個 Gmail 在不同裝置輸入後，可取得同一份資料。
      2. 如果沒有設定：
         → 使用 localStorage 示範模式。
         → 資料只存在目前瀏覽器。

      注意：
      這裡「輸入 Gmail」不是 Google OAuth 登入。
      不會驗證 Gmail 是否真的屬於使用者。
      因此它比較像「帳號識別碼」，不是安全的會員登入系統。
      ============================================================
    */

    const SUPABASE_URL = "";      // 例如：https://xxxxx.supabase.co
    const SUPABASE_ANON_KEY = ""; // Supabase Project Settings → API → anon key

    const MOODS = [
      { id: "happy", emoji: "😊", label: "HAPPY" },
      { id: "soso", emoji: "😐", label: "SO-SO" },
      { id: "sad", emoji: "😭", label: "SAD" },
      { id: "angry", emoji: "😡", label: "ANGRY" },
      { id: "calm", emoji: "🌿", label: "CALM" }
    ];

    const monthNames = [
      "一月","二月","三月","四月","五月","六月",
      "七月","八月","九月","十月","十一月","十二月"
    ];

    const state = {
      currentDate: new Date(),
      selectedDate: null,
      selectedMood: "happy",
      email: "",
      diaryData: {},
      backendReady: false
    };

    const calendarEl = document.getElementById("calendar");
    const monthTitleEl = document.getElementById("monthTitle");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalDate = document.getElementById("modalDate");
    const titleInput = document.getElementById("titleInput");
    const contentInput = document.getElementById("contentInput");
    const deleteBtn = document.getElementById("deleteBtn");
    const accountStatus = document.getElementById("accountStatus");
    const emailInput = document.getElementById("emailInput");
    const setupNotice = document.getElementById("setupNotice");
    const loading = document.getElementById("loading");

    state.backendReady = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

    if (state.backendReady) {
      setupNotice.style.display = "none";
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function dateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function parseKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function todayKey() {
      return dateKey(new Date());
    }

    function isFutureKey(key) {
      return key > todayKey();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeEmail(email) {
      return email.trim().toLowerCase();
    }

    function validGmail(email) {
      return /^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@gmail\.com$/i.test(email);
    }

    function setLoading(show) {
      loading.classList.toggle("show", show);
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function showAccount() {
      if (state.email) {
        accountStatus.textContent = `目前帳號：${state.email}`;
      } else {
        accountStatus.textContent = "請輸入 Gmail，然後按「登入／建立我的日記」或直接按 Enter";
      }
    }

    function localStorageKey() {
      return `moodCalendar_${state.email}`;
    }

    function loadLocalData() {
      try {
        return JSON.parse(localStorage.getItem(localStorageKey()) || "{}");
      } catch {
        return {};
      }
    }

    function saveLocalData() {
      localStorage.setItem(localStorageKey(), JSON.stringify(state.diaryData));
    }

    async function supabaseRequest(path, options = {}) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: options.method === "POST"
            ? "resolution=merge-duplicates,return=minimal"
            : undefined,
          ...(options.headers || {})
        }
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `HTTP ${response.status}`);
      }

      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    async function loadBackendData() {
      const email = encodeURIComponent(state.email);
      const rows = await supabaseRequest(
        `diaries?email=eq.${email}&select=date,mood,emoji,title,content,created_at,updated_at&order=date.asc`
      );

      const result = {};
      for (const row of rows || []) {
        result[row.date] = {
          mood: row.mood,
          emoji: row.emoji,
          title: row.title || "",
          content: row.content || "",
          createdAt: row.created_at,
          updatedAt: row.updated_at
        };
      }
      return result;
    }

    async function upsertBackendDiary(key, diary) {
      await supabaseRequest("diaries?on_conflict=email,date", {
        method: "POST",
        body: JSON.stringify({
          email: state.email,
          date: key,
          mood: diary.mood,
          emoji: diary.emoji,
          title: diary.title,
          content: diary.content,
          updated_at: new Date().toISOString()
        })
      });
    }

    async function deleteBackendDiary(key) {
      const email = encodeURIComponent(state.email);
      const date = encodeURIComponent(key);
      await supabaseRequest(`diaries?email=eq.${email}&date=eq.${date}`, {
        method: "DELETE"
      });
    }

    async function loginWithGmail() {
      const email = normalizeEmail(emailInput.value);

      if (!validGmail(email)) {
        toast("請輸入有效的 Gmail，例如 name@gmail.com");
        emailInput.focus();
        return;
      }

      state.email = email;
      setLoading(true);

      try {
        if (state.backendReady) {
          state.diaryData = await loadBackendData();
        } else {
          state.diaryData = loadLocalData();
        }

        localStorage.setItem("moodCalendarLastEmail", email);
        showAccount();
        renderCalendar();
        toast(`已進入 ${email} 的日記`);
      } catch (error) {
        console.error(error);
        toast("讀取資料失敗，請檢查 Supabase 設定");
        state.email = "";
        state.diaryData = {};
        showAccount();
      } finally {
        setLoading(false);
      }
    }

    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();

      monthTitleEl.textContent = `${year} 年 ${monthNames[month]}`;
      calendarEl.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      // 將 Sunday=0 轉成 Monday=0
      const startOffset = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendarEl.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const key = dateKey(date);
        const future = isFutureKey(key);
        const diary = state.diaryData[key];
        const isToday = key === todayKey();

        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = `day${future ? " future" : ""}${isToday ? " today" : ""}`;
        cell.disabled = future || !state.email;

        const top = document.createElement("div");
        top.innerHTML = `<span class="day-number">${day}</span>${isToday ? '<span class="today-label">今天</span>' : ""}`;
        cell.appendChild(top);

        if (diary) {
          const mood = document.createElement("div");
          mood.className = "mood-emoji";
          mood.textContent = diary.emoji || "😊";
          cell.appendChild(mood);

          if (diary.title) {
            const title = document.createElement("div");
            title.className = "day-title";
            title.textContent = diary.title;
            cell.appendChild(title);
          }
        } else if (future) {
          const futureLabel = document.createElement("div");
          futureLabel.className = "future-label";
          futureLabel.textContent = "尚未到這一天";
          cell.appendChild(futureLabel);
        } else {
          const mood = document.createElement("div");
          mood.className = "mood-emoji";
          mood.textContent = "＋";
          mood.style.color = "#c7becb";
          cell.appendChild(mood);
        }

        if (!state.email && !future) {
          cell.disabled = true;
        }

        if (!future && state.email) {
          cell.addEventListener("click", () => openDiary(key));
        }

        calendarEl.appendChild(cell);
      }
    }

    function renderMoods() {
      const moodsEl = document.getElementById("moods");
      moodsEl.innerHTML = "";

      for (const mood of MOODS) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `mood${state.selectedMood === mood.id ? " selected" : ""}`;
        button.innerHTML = `
          <span class="emoji">${mood.emoji}</span>
          <span class="label">${mood.label}</span>
        `;
        button.addEventListener("click", () => {
          state.selectedMood = mood.id;
          renderMoods();
        });
        moodsEl.appendChild(button);
      }
    }

    function openDiary(key) {
      if (!state.email) {
        toast("請先輸入 Gmail");
        return;
      }

      if (isFutureKey(key)) {
        toast("不能寫未來的日記");
        return;
      }

      state.selectedDate = key;
      const existing = state.diaryData[key];

      modalTitle.textContent = existing ? "編輯心情日記" : "新增心情日記";
      modalDate.textContent = `${key} ・ ${new Intl.DateTimeFormat("zh-TW", {
        weekday: "long"
      }).format(parseKey(key))}`;

      state.selectedMood = existing?.mood || "happy";
      titleInput.value = existing?.title || "";
      contentInput.value = existing?.content || "";
      deleteBtn.style.visibility = existing ? "visible" : "hidden";

      renderMoods();
      modalOverlay.classList.add("show");
      titleInput.focus();
    }

    function closeModal() {
      modalOverlay.classList.remove("show");
      state.selectedDate = null;
    }

    async function saveDiary() {
      if (!state.email || !state.selectedDate) return;

      if (isFutureKey(state.selectedDate)) {
        toast("不能儲存未來日期的日記");
        return;
      }

      const mood = MOODS.find(m => m.id === state.selectedMood) || MOODS[0];
      const now = new Date().toISOString();
      const old = state.diaryData[state.selectedDate];

      const diary = {
        mood: mood.id,
        emoji: mood.emoji,
        title: titleInput.value.trim(),
        content: contentInput.value.trim(),
        createdAt: old?.createdAt || now,
        updatedAt: now
      };

      setLoading(true);

      try {
        if (state.backendReady) {
          await upsertBackendDiary(state.selectedDate, diary);
        }

        state.diaryData[state.selectedDate] = diary;

        if (!state.backendReady) {
          saveLocalData();
        }

        closeModal();
        renderCalendar();
        toast("日記已儲存 🌷");
      } catch (error) {
        console.error(error);
        toast("儲存失敗，請檢查後端設定");
      } finally {
        setLoading(false);
      }
    }

    async function deleteDiary() {
      if (!state.selectedDate || !state.diaryData[state.selectedDate]) return;

      const yes = confirm("確定要刪除這一天的日記嗎？");
      if (!yes) return;

      setLoading(true);

      try {
        if (state.backendReady) {
          await deleteBackendDiary(state.selectedDate);
        }

        delete state.diaryData[state.selectedDate];

        if (!state.backendReady) {
          saveLocalData();
        }

        closeModal();
        renderCalendar();
        toast("日記已刪除");
      } catch (error) {
        console.error(error);
        toast("刪除失敗，請檢查後端設定");
      } finally {
        setLoading(false);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", loginWithGmail);

    emailInput.addEventListener("keydown", event => {
      if (event.key === "Enter") loginWithGmail();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      state.currentDate = new Date(
        state.currentDate.getFullYear(),
        state.currentDate.getMonth() - 1,
        1
      );
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      const next = new Date(
        state.currentDate.getFullYear(),
        state.currentDate.getMonth() + 1,
        1
      );

      // 可以瀏覽未來月份，但未來日期不能點選/新增
      state.currentDate = next;
      renderCalendar();
    });

    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("saveBtn").addEventListener("click", saveDiary);
    deleteBtn.addEventListener("click", deleteDiary);

    modalOverlay.addEventListener("click", event => {
      if (event.target === modalOverlay) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modalOverlay.classList.contains("show")) {
        closeModal();
      }
    });

    // 如果之前在此瀏覽器登入過，保留 Gmail 顯示；仍需要按「進入我的日記」讀取資料。
    const lastEmail = localStorage.getItem("moodCalendarLastEmail");
    if (lastEmail) {
      emailInput.value = lastEmail;
    }

    renderMoods();
    showAccount();
    renderCalendar();
  </script>
</body>
</html>
